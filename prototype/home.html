<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>动作游戏设计知识库</title>
  <meta name="description" content="从 GDC 演讲与开发者分享中，沉淀动作游戏设计的思考、方法与案例。" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" />
  <style>
    :root { --bg: #faf9f6; --ink: #1d1d26; --muted: #83838d; --line: #ece8df; --indigo: #26264f; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif; -webkit-font-smoothing: antialiased; }
    .wrap { max-width: 1160px; margin: 0 auto; padding: 44px 28px 100px; }

    .hero { margin-bottom: 30px; }
    .hero-row { display: grid; grid-template-columns: 1fr 1fr; margin-bottom: 22px; width: 100%; }
    .hero-row .left { display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--line); padding-right: 28px; }
    .hero-row .right { display: flex; align-items: center; justify-content: center; padding-left: 28px; }
    .hero h1 { font-family: 'LXGW WenKai','PingFang SC',sans-serif; font-size: 40px; font-weight: 700; margin: 0; letter-spacing: 1px; text-align: center; }
    .hero .sub { color: var(--muted); font-size: 14px; line-height: 1.8; margin: 0; text-align: center; }
    .search { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 6px 6px 18px; background: #fff; border: 1px solid var(--line); border-radius: 999px; box-shadow: 0 4px 18px rgba(0,0,0,.06); transition: box-shadow .2s, border-color .2s; }
    .search:focus-within { border-color: var(--indigo); box-shadow: 0 6px 24px rgba(38,38,79,.12); }
    .search input { flex: 1; border: 0; outline: 0; font-size: 15px; background: transparent; color: var(--ink); }
    .search .icon { color: var(--muted); }
    .search .sbtn { border: 0; background: var(--indigo); color: #fff; font-family: inherit; font-size: 14px; padding: 10px 20px; border-radius: 999px; cursor: pointer; transition: opacity .15s; }
    .search .sbtn:hover { opacity: .88; }

    /* 来源筛选（颜色 = 卡片同款 hash 渐变） */
    .srcbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 28px; width: fit-content; }
    .src-chip {
      display: inline-flex; align-items: center; gap: 7px;
      border: 0; cursor: pointer; color: #fff; font-family: inherit;
      font-size: 13px; padding: 7px 14px; border-radius: 999px;
      box-shadow: 0 2px 6px rgba(0,0,0,.12);
      transition: transform .15s, box-shadow .15s, opacity .15s;
    }
    .src-chip:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,.18); }
    .src-chip .c { font-size: 11px; opacity: .8; }
    .src-chip.dim { opacity: .4; }
    .src-chip.active { outline: 2px solid #1d1d26; outline-offset: 2px; }

    .layout { display: grid; grid-template-columns: 120px 1fr; gap: 28px; }
    .rail { position: sticky; top: 40px; align-self: start; height: calc(100vh - 80px); overflow: hidden; }
    .rail .line { position: relative; padding-left: 26px; border-left: 2px solid var(--line); }
    .tnode { position: relative; display: flex; align-items: center; height: 34px; cursor: pointer; color: #b0b0ba; font-size: 13px; transition: color .2s; }
    .tnode .dot { position: absolute; left: -31px; width: 9px; height: 9px; border-radius: 50%; background: #d8d5cc; border: 2px solid #faf9f6; transition: all .2s; }
    .tnode.active { color: var(--indigo); font-weight: 700; }
    .tnode.active .dot { background: var(--indigo); transform: scale(1.35); }

    .year-sec { margin-bottom: 34px; }
    .year-sec h2 { font-size: 24px; margin: 0 0 14px; font-weight:700; color: var(--indigo); display: flex; align-items: baseline; gap: 10px; }
    .year-sec h2 .n { font-size: 13px; color: var(--muted); font-weight: 400; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }

    .art {
      position: relative; display: flex; flex-direction: column; justify-content: space-between;
      min-height: 150px; padding: 18px 18px 16px; border-radius: 14px; overflow: hidden;
      text-decoration: none; color: #fff; cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,.16); transition: transform .2s ease, box-shadow .2s ease;
    }
    .art::after { content: ''; position: absolute; inset: 0; background: radial-gradient(120% 120% at 100% 0%, rgba(255,255,255,.10), transparent 55%); pointer-events: none; }
    .art:hover { transform: translateY(-5px); box-shadow: 0 18px 38px rgba(0,0,0,.24); }
    .art .kick { font-size: 12px; letter-spacing: .8px; opacity: .68; margin-bottom: 8px; }
    .art .title { font-family: 'LXGW WenKai','PingFang SC',sans-serif; font-size: 17.5px; font-weight: 700; line-height: 1.45; }
    .art .hook { font-size: 12.5px; opacity: .6; line-height: 1.6; margin-top: 8px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .art .chiprow { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
    .art .chip { font-size: 11px; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22); }
    .empty { display: none; color: #aaa; text-align: center; padding: 40px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="hero-row">
        <div class="left"><h1>动作游戏设计知识库</h1></div>
        <div class="right"><p class="sub">收录 GDC 演讲与开发者分享，<br />沉淀动作游戏设计的<br />思考、方法与案例。</p></div>
      </div>
      <div class="search"><span class="icon">🔍</span><input id="q" placeholder="搜索分享标题、观点、厂商…" /><button class="sbtn">搜索</button></div>
    </header>

    <div class="srcbar" id="srcbar"></div>

    <div class="layout">
      <aside class="rail"><div class="line" id="rail"></div></aside>
      <main id="content"></main>
    </div>
    <div class="empty" id="empty">没有匹配的内容</div>
  </div>

  <script>
    const DATA = [
      { t: '2023 · 战神 AI', h: '战神 AI 从 Lua 转行为树的迭代与经验。', s: 'Santa Monica Studio', y: 2023, g: ['AI'] },
      { t: '动作游戏设计的 SSS 方法', h: 'Situation-Solution-Stage，情形-解决-编排。', s: '设计者笔记', y: 2023, g: ['SSS'] },
      { t: '2019 · 鬼泣 5', h: '核心乐趣：克服困难并调整的成就感。', s: 'Capcom', y: 2019, g: ['核心乐趣'] },
      { t: '2019 · 战神 战斗系统', h: '新视角下战斗系统的革新。', s: 'Santa Monica Studio', y: 2019, g: ['战斗系统'] },
      { t: '2019 · FTG 十年来的易玩性', h: '如何为古老的 FTG 游戏扩充受众。', s: 'FTG 相关', y: 2019, g: ['易玩性'] },
      { t: '2018 · 怪物猎人 世界', h: '在实机原型中验证概念、制作技术与标准。', s: 'Capcom', y: 2018, g: ['原型'] },
      { t: '2018 · 尼尔', h: '自由感是玩家突破限制的那一刻。', s: 'PlatinumGames', y: 2018, g: ['自由感'] },
      { t: '街霸 5 的美术设计思路', h: '在满足「瞬间传达信息」的前提下，再考虑独特美术表现。', s: 'Capcom', y: 2017, g: ['美术设计'] },
      { t: '2017 · 仁王', h: '如何通过玩家反馈来重塑游戏。', s: '其他', y: 2017, g: ['玩家反馈'] },
      { t: '2017 · 塞尔达 旷野之息', h: '勇气三角革新玩法，智慧三角想法落地。', s: 'Nintendo', y: 2017, g: ['塞尔达'] },
      { t: '2016 · 无国界 ACT', h: '动作游戏的本质是「被动游戏」：根据状况做出响应。', s: 'PlatinumGames', y: 2016, g: ['被动游戏'] },
      { t: '2015 · 罪恶装备 Xrd', h: '在 3D 框架内重建经典 2D 格斗视觉。', s: 'FTG 相关', y: 2015, g: ['渲染'] },
      { t: '1999 · 宫本茂', h: '游戏是一个更大、更广阔的世界的一部分。', s: 'Nintendo', y: 1999, g: ['设计哲学'] },
      { t: '河森正治 · 原创性', h: '跟不同次元的事物融合。', s: '非 GDC', y: 0, g: ['原创性'] },
      { t: '关卡设计术语', h: '掌握常用关卡设计术语。', s: '非 GDC', y: 0, g: ['关卡设计'] },
      { t: '动作游戏的本质', h: '通过奖惩设计，让玩家控制角色行动这件事更有乐趣。', s: '设计者笔记', y: 0, g: ['方法论'] },
    ];

    function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
    // 来源名 hash → 映射到成熟配色方案（Tailwind 800→700 深色渐变，白字可读）
    const PALETTE = [
      ['#312e81','#4338ca'], ['#9f1239','#be123c'], ['#9a3412','#c2410c'], ['#065f46','#047857'],
      ['#155e75','#0e7490'], ['#1e3a8a','#1d4ed8'], ['#4c1d95','#6d28d9'], ['#831843','#a21caf'],
      ['#7c2d12','#b45309'], ['#365314','#4d7c0f'],
    ];
    function gradientFor(str) { const [a, b] = PALETTE[hash(str) % PALETTE.length]; return `linear-gradient(140deg, ${a} 0%, ${b} 100%)`; }

    const SRC_ORDER = ['Capcom','PlatinumGames','Santa Monica Studio','FTG 相关','其他','Nintendo','非 GDC','设计者笔记'];
    const SRC_SET = [...new Set(DATA.map(d => d.s))].sort((a,b) => (SRC_ORDER.indexOf(a) - SRC_ORDER.indexOf(b)));

    let filter = { q: '', src: '' };
    function visible() {
      return DATA.filter(d =>
        (!filter.src || d.s === filter.src) &&
        (!filter.q || (d.t + d.h + d.s).toLowerCase().includes(filter.q.toLowerCase()))
      );
    }
    function grouped() {
      const m = new Map();
      for (const d of visible()) { const k = d.y || '未标注'; if (!m.has(k)) m.set(k, []); m.get(k).push(d); }
      const keys = [...m.keys()].sort((a, b) => (b === '未标注' ? -1 : a === '未标注' ? 1 : b - a));
      return keys.map(k => ({ year: k, items: m.get(k) }));
    }
    function artHtml(d) {
      return `<a class="art" href="#" style="background:${gradientFor(d.s)}">
        <div><div class="kick">${d.s}${d.y ? ' · ' + d.y : ''}</div><div class="title">${d.t}</div><div class="hook">${d.h}</div></div>
        <div class="chiprow">${d.g.map(g => `<span class="chip">${g}</span>`).join('')}</div>
      </a>`;
    }

    function renderSrcbar() {
      document.getElementById('srcbar').innerHTML = [
        `<button class="src-chip${!filter.src ? ' active' : ''}" data-src="" style="background:linear-gradient(140deg,#26264f,#3a3a72)">全部<span class="c">${DATA.length}</span></button>`,
        ...SRC_SET.map(s => {
          const n = DATA.filter(d => d.s === s).length;
          const active = filter.src === s ? ' active' : '';
          const dim = (filter.src && filter.src !== s) ? ' dim' : '';
          return `<button class="src-chip${active}${dim}" data-src="${s}" style="background:${gradientFor(s)}">${s}<span class="c">${n}</span></button>`;
        })
      ].join('');
    }

    function render() {
      const groups = grouped();
      document.getElementById('content').innerHTML = groups.map(gr =>
        `<section class="year-sec" data-year="${gr.year}">
          <h2>${gr.year}<span class="n">${gr.items.length} 篇</span></h2>
          <div class="cards">${gr.items.map(artHtml).join('')}</div>
        </section>`).join('');
      document.getElementById('rail').innerHTML = groups.map(gr =>
        `<div class="tnode" data-year="${gr.year}"><span class="dot"></span>${gr.year}</div>`).join('');
      document.getElementById('empty').style.display = visible().length ? 'none' : 'block';

      const io = new IntersectionObserver(entries => {
        entries.forEach(en => { if (en.isIntersecting) {
          const y = en.target.dataset.year;
          document.querySelectorAll('.tnode').forEach(n => n.classList.toggle('active', n.dataset.year === y));
        }});
      }, { rootMargin: '-35% 0px -55% 0px', threshold: 0 });
      document.querySelectorAll('.year-sec').forEach(s => io.observe(s));
    }

    renderSrcbar(); render();

    document.getElementById('srcbar').addEventListener('click', e => {
      const b = e.target.closest('.src-chip'); if (!b) return;
      filter.src = b.dataset.src;
      renderSrcbar(); render();
    });
    document.getElementById('q').addEventListener('input', e => { filter.q = e.target.value.trim(); render(); });
    document.getElementById('rail').addEventListener('click', e => {
      const n = e.target.closest('.tnode'); if (!n) return;
      const sec = document.querySelector(`.year-sec[data-year="${n.dataset.year}"]`);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  </script>
</body>
</html>
